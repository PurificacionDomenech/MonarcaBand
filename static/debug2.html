<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Debug2</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px}
#chart{width:600px;height:300px;background:#111;border:1px solid #333}
#info{margin-top:10px;color:#fff;white-space:pre-wrap}
</style>
</head>
<body>
<h2>Plotly DOM Test</h2>
<div id="chart"></div>
<div id="info"></div>
<script>
const info = document.getElementById('info');
function log(msg){ info.textContent += msg + '\n'; }

log('typeof Plotly = ' + typeof Plotly);

const traces = [{x:[0,1,2,3,4],y:[100,101,102,103,104],type:'scatter',mode:'lines',line:{color:'#0f0',width:2}}];
const layout = {
  width:600, height:300,
  paper_bgcolor:'#000',plot_bgcolor:'#111',
  margin:{t:20,r:20,b:40,l:40},
  xaxis:{gridcolor:'#222'},
  yaxis:{gridcolor:'#222'}
};

try{
  Plotly.newPlot('chart', traces, layout, {responsive:false,displayModeBar:false});
  log('newPlot called OK');
  const chartDiv = document.getElementById('chart');
  log('chart children: ' + chartDiv.children.length);
  log('chart innerHTML length: ' + chartDiv.innerHTML.length);
  const svg = chartDiv.querySelector('svg');
  log('has SVG: ' + !!svg);
  if(svg){
    log('SVG width: ' + svg.getAttribute('width'));
    log('SVG height: ' + svg.getAttribute('height'));
    const paths = svg.querySelectorAll('path');
    log('SVG paths: ' + paths.length);
    const lines = svg.querySelectorAll('.scatterlayer');
    log('scatter layers: ' + lines.length);
  }
  const jsPlot = chartDiv.querySelector('.js-plotly-plot');
  log('has js-plotly-plot: ' + !!jsPlot);
} catch(e) {
  log('ERROR: ' + e.message);
}
</script>
</body></html>
