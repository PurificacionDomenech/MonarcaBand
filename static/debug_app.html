<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug App</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
body{background:#000;color:#0f0;font-family:monospace;margin:0;padding:20px}
#chart{width:100%;height:580px;border:2px solid #0f0;background:#010601}
#status{margin-bottom:10px;padding:10px;border:1px solid #0f0}
</style>
</head>
<body>
<div id="status">Waiting...</div>
<div id="chart"></div>
<script>
const status = document.getElementById('status');
status.textContent = 'Fetching chart data...';

fetch('/api/chart/%5EDJI')
  .then(r => r.json())
  .then(data => {
    status.textContent = 'Data received, candles: ' + (data.chart?.candles?.length || 0);
    const cd = data.chart;
    if (!cd || !cd.candles || !cd.candles.length) {
      status.textContent = 'No candles!';
      return;
    }
    const dates = cd.candles.map(c => new Date(c.x));
    const closes = cd.candles.map(c => c.c);
    const traces = [{
      x: dates, y: closes,
      type: 'scatter', mode: 'lines',
      line: {color: 'rgba(255,255,255,.92)', width: 1.8}
    }];
    const layout = {
      autosize: true,
      paper_bgcolor: '#000',
      plot_bgcolor: '#010601',
      margin: {t: 10, r: 70, b: 50, l: 50},
      xaxis: {type: 'date', gridcolor: 'rgba(0,255,65,.04)'},
      yaxis: {side: 'right'}
    };
    Plotly.newPlot('chart', traces, layout, {responsive: true, displayModeBar: false});
    status.textContent = 'Chart rendered!';
  })
  .catch(e => {
    status.textContent = 'ERROR: ' + e.message;
  });
</script>
</body>
</html>
