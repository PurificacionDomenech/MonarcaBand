<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Debug</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px}
#chart{display:block;width:600px;height:300px;border:1px solid #333;margin-top:20px;background:#111}
#status{padding:10px;border:1px solid #0f0;display:inline-block}
</style>
</head>
<body>
<h2>Plotly Debug Test</h2>
<div id="status">INIT</div>
<div id="chart"></div>
<script>
const st = document.getElementById('status');
st.textContent = 'JS RUNNING';
st.style.borderColor = 'blue';

function test() {
  try {
    st.textContent = 'CALLING newPlot...';
    const traces = [{x:[1,2,3,4,5],y:[10,15,13,17,14],type:'scatter',mode:'lines',line:{color:'#0f0',width:2}}];
    const layout = {
      width: 600, height: 300,
      paper_bgcolor:'#000',plot_bgcolor:'#111',
      margin:{t:10,r:10,b:30,l:30},
      xaxis:{gridcolor:'#222',color:'#0f0'},
      yaxis:{gridcolor:'#222',color:'#0f0'}
    };
    Plotly.newPlot('chart', traces, layout, {responsive:false,displayModeBar:false});
    st.textContent = 'PLOTLY OK';
    st.style.borderColor = '#0f0';
  } catch(e) {
    st.textContent = 'ERROR: ' + e.message;
    st.style.borderColor = 'red';
  }
}

st.textContent = 'PLOTLY type=' + (typeof Plotly);
if (typeof Plotly !== 'undefined' && Plotly.newPlot) {
  st.style.borderColor = 'orange';
  setTimeout(test, 500);
} else {
  st.textContent = 'PLOTLY NOT AVAILABLE';
  st.style.borderColor = 'red';
}
</script>
</body></html>
