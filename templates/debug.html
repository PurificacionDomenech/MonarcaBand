<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Debug</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>body{background:#000;color:#0f0;font-family:monospace;padding:20px}#chart{width:100%;height:400px}</style>
</head>
<body>
<h3>Plotly Debug</h3>
<div id="status">loading...</div>
<div id="chart"></div>
<script>
document.getElementById('status').textContent = 'JS running';
try {
  const traces = [{x:[1,2,3],y:[1,4,2],type:'scatter',mode:'lines'}];
  const layout = {paper_bgcolor:'#000',plot_bgcolor:'#111',margin:{t:10,r:10,b:30,l:30}};
  Plotly.newPlot('chart', traces, layout);
  document.getElementById('status').textContent = 'SUCCESS: chart rendered';
} catch(e) {
  document.getElementById('status').textContent = 'ERROR: ' + e.message;
}
</script>
</body>
</html>
